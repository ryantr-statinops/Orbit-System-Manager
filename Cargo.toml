[package]
name = "orbit-system-manager"
version = "2.1.2"
description = "Orbit System Manager - Real-time System Monitoring & 3D Topology"
authors = ["ryantr-statinops"]
license = "MIT"
repository = "https://github.com/ryantr-statinops/Orbit-System-Manager"
edition = "2021"
rust-version = "1.99.1"

[[bin]]
name = "orbit-system-manager"
path = "src/main.rs"

[dependencies]
slint = "=1.18.1"
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[features]
dashboard-screenshot = ["dep:i-slint-backend-testing", "dep:image"]

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
