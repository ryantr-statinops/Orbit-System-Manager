[package]
name = "orbit-system-manager"
version = "1.0.0"
description = "Orbit System Manager - Real-time System Monitoring & 3D Topology"
authors = ["ryantr-statinops"]
license = "MIT"
repository = "https://github.com/ryantr-statinops/Orbit-System-Manager"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "orbit-system-manager"
path = "src/main.rs"

[dependencies]
slint = "1.9"
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[build-dependencies]
slint-build = "1.9"
