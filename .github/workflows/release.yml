name: Release / Multi-Platform Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: orbit-system-manager-windows-x86_64.zip
            bin: orbit-system-manager.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: orbit-system-manager-linux-x86_64.tar.gz
            bin: orbit-system-manager
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: orbit-system-manager-macos-x86_64.zip
            bin: orbit-system-manager
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: orbit-system-manager-macos-aarch64.zip
            bin: orbit-system-manager

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin }} -DestinationPath ${{ matrix.artifact }}

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release ${{ matrix.bin }}

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        run: |
          zip -j ${{ matrix.artifact }} target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  create-github-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Orbit System Manager ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
