name: CI / Windows Slint Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  slint-check:
    name: Check Slint & Rust (Windows x64)
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.1"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust Compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  dashboard-preview:
    name: Capture dashboard preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Capture deterministic dashboard preview
        run: >-
          cargo run --locked --features dashboard-screenshot --
          --demo-state full --demo-cores 16
          --capture-dashboard artifacts/dashboard-preview.png
          --capture-size 1465x955

      - name: Upload dashboard preview
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview-${{ github.sha }}
          path: artifacts/dashboard-preview.png
          if-no-files-found: error
          retention-days: 14
