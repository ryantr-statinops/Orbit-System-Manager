name: CI / Cross-Platform Slint Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  slint-check:
    name: Check Slint & Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
        rust: ["1.99.1"]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust Compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  dashboard-preview:
    name: Capture dashboard preview
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Capture deterministic dashboard preview
        run: >-
          cargo run --locked --features dashboard-screenshot --
          --demo-state full --demo-cores 16
          --capture-dashboard artifacts/dashboard-preview.png
          --capture-size 1465x955

      - name: Upload dashboard preview
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview-${{ github.sha }}
          path: artifacts/dashboard-preview.png
          if-no-files-found: error
          retention-days: 14
