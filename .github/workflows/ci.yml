name: CI / Cross-Platform Slint Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  slint-check:
    name: Check Slint & Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust Compilation
        run: cargo check
